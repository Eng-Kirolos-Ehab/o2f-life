# keeps the free Supabase project awake (it pauses after 7 idle days); O2F Start codes live there
name: supabase-keepalive
on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -o /dev/null -w "%{http_code}\n" -X POST \
            "https://qalzanmeusuqssrgxumg.supabase.co/rest/v1/rpc/claim_start_code" \
            -H "apikey: sb_publishable_9VVNo9eKlSTyVaE1a2GICA_xGESK9TC" \
            -H "Content-Type: application/json" \
            -d '{"p_hash":"0000000000000000","p_name":"keepalive"}'
